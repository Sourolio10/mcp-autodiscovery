[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-autodiscovery"
version = "0.1.0"
description = "MCP server that dynamically discovers and registers tools from any OpenAPI spec at runtime"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.scripts]
mcp-autodiscovery = "autodiscovery.server:main_sync"

[tool.hatch.build.targets.wheel]
packages = ["src/autodiscovery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]
